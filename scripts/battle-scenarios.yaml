    success_criteria:
      - { name: voter_swarm_flagged,   type: boolean, target: "true", weight: 40 }
      - { name: outcome_settles_clean, type: boolean, target: "true", weight: 40 }
      - { name: linkage_in_audit,      type: boolean, target: "true", weight: 20 }
    sponsor: alice
    cosponsors: []
    solvers: [bob, heidi]
    voters: [ivan, ivan2, ivan3, grace, carol]
    intended_winner_profile: heidi
    expected_solver_count: 2
    expected_voter_count: 5
    sybil_links: [[ivan, ivan2, ivan3]]
    expected_outcome: defense_holds  # honest voters keep the ranking honest
    expected_sybil_findings: ["linked:ivan-ivan2-ivan3"]

  - id: sybil04_cosponsor_then_solve
    domain: economic
    title: "An operator co-sponsors a question and then submits a solution to it."
    description: |
      frank co-sponsors a question that alice initially funded, and
      then frank also commits a solution. There is no protocol-level
