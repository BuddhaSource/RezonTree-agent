    solvers: [frank, bob]
    voters: [carol, grace, eve]
    intended_winner_profile: bob
    expected_solver_count: 2
    expected_voter_count: 3
    sybil_links: [[frank]]
    expected_outcome: success
    expected_sybil_findings: ["cosponsor_solver:frank"]

