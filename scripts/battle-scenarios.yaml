# ───────────────────────────────────────────────────────────────
# SYBIL SCENARIOS (5)
# Each isolates one sybil pattern. The runner asserts:
#   • All wallets behave individually (chain accepts their txs)
#   • Backend produces no anomaly that breaks settlement
#   • The audit report flags the linkage in `sybil_findings`
#   • For "self-vote" / "self-fund-self-vote", the outcome should
#     NOT differ from a no-attack baseline given remaining honest
#     voters' conviction.
# ───────────────────────────────────────────────────────────────

sybil_scenarios:
  # Each scenario tests one sybil pattern. The harness records linked
  # operators in sybilFindings and asserts conviction-balance
  # holds when honest voters dominate. New scenarios should keep
  # `description` ≥ 1000 chars and use only wallets that the operator
  # has funded (idx 1-13 in our distribution).
  # ───────────────────────────────────────────────────────────────

  - id: sybil01_sponsor_voter
    domain: governance
    title: "Same operator both sponsors a question and votes on its solutions."
    description: |
      The operator behind ivan also controls ivan2 and ivan3 (all
      derived from one mnemonic). Today ivan sponsors a question and
      then ivan2 votes for ivan3's solution. The protocol has no
      cryptographic way to detect that the three wallets share a
      controller, so the on-chain math accepts each signature
      independently. The economic question is whether the conviction
      that *honest* voters bring (carol + grace, in this scenario)
      is enough to dilute ivan2's self-interested allocation, and
      whether the audit log makes the linkage visible to the human
      reviewing the round outcome later.

      ## Operating constraints

      Solutions must address each criterion with a falsifiable claim
      that a reader without inside knowledge could check. Voters
      reward solvers who concede uncertainty where it is real and
      hand-wave less than competing solutions. A solution that
      paraphrases the question without doing load-bearing reasoning
      typically settles in the bottom half of the ranking.

      **What earns rank.** Walking through the failure modes one-by-
      one, showing how the proposed approach fails-safe in each, and
      quantifying the residual risk. Solutions that lead with "here's
      what could go wrong, here's how I detect it, here's how I roll
      back" consistently out-rank those that lead with diagrams.

      **What disqualifies a solution.** Hand-waving over trade-offs.
      Citing tools the team doesn't run without justifying the
      operational cost. Solving a different question than the one
      asked. Conflating "can be done" with "can be done at our scale."

      The sybil test is independent of solution quality. The honest
      voters judge each solution on its merits; the sybil link is
      only material when the sybils' conviction would tip an
      otherwise-tied ranking. We're observing whether the harness's
      audit cleanly logs `linked:ivan-ivan2-ivan3` regardless of the
      actual ranking outcome — that is the protection.
    success_criteria:
      - { name: linkage_documented,    type: boolean, target: "true", weight: 40 }
      - { name: honest_majority_holds, type: boolean, target: "true", weight: 40 }
      - { name: round_settles,         type: boolean, target: "true", weight: 20 }
    sponsor: ivan
    cosponsors: []
    solvers: [bob, heidi]
    voters: [ivan2, carol, grace]
    intended_winner_profile: bob
    expected_solver_count: 2
    expected_voter_count: 3
    sybil_links: [[ivan, ivan2, ivan3]]
    expected_outcome: success  # honest majority should still settle correctly
    expected_sybil_findings: ["linked:ivan-ivan2-ivan3"]

  - id: sybil02_solver_voter_self
    domain: technical
    title: "Solver wallet votes for its own solution via a linked sybil."
    description: |
      bob commits a solution. ivan2 (linked to bob via shared
      operator) then votes heavily for bob's solution. The protocol
      cannot block this without a Sybil-resistant identity layer
      (which RezonTree intentionally does not have at L1). The
      defense is reputational: the audit log records the linkage,
      and over many rounds the platform's reputation score for the
      operator declines if they consistently engage in self-voting.
      In the short run, honest voters' conviction must dominate.

      ## Operating constraints

      Solutions must address each criterion with a falsifiable claim
      that a reader without inside knowledge could check. Voters
      reward solvers who concede uncertainty where it is real. A
      solution that paraphrases the question without doing load-
