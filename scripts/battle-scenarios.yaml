# battle-scenarios.yaml — Phase D end-to-end demo scenarios.
#
# 24 questions cover technical, governance, policy, design, and
# economic domains, plus dedicated sybil + attack-vector lanes.
#
# Roles map to wallet indices derived from RT_AGENT_MNEMONIC via
# m/44'/60'/0'/0/N. The runner (run-battle.ts) pulls the wallet
# pool from the bootstrap file at the configured index range.
#
# Schema notes:
#   role pool letters (a..n) — abstract; the runner maps each
#     letter to a wallet index when bootstrapping (default a=1, b=2,
#     c=3, … and 0 is reserved for the operator/oracle/fee).
#   sybil_links — list-of-lists; each inner list names role letters
#     that share an operator. The runner enforces "same-mnemonic
#     subgroup" so an operator can run multiple wallets but
#     reputation/payout audits flag the linkage.
#   attack — single-string label (one per scenario). The runner
#     dispatches to a named attack handler that asserts the
#     defense (HTTP 4xx code at backend OR chain revert OR
#     no-disproportionate-influence on outcome).
#   expected_outcome — `success` | `expected_failure` |
#     `defense_holds` (for attack scenarios that should NOT settle
#     the way the attacker wanted).
#
# R-CHAIN-VERIFIES-INTENT — every signed intent reaches the chain
#   and is verified there; backend rejection is a fast-fail, not a
#   substitute for chain enforcement.
# R-CLIENT-IS-TRUST-ORIGIN — clients construct intents from the
#   advertised preflight; attacker scenarios deliberately violate
#   this to test detection.
# R-MALICIOUS-FLOW — attack catalogue tracks each malicious flow
#   to its defense layer.

version: 1
chain: base-sepolia
forge_address_env: RT_FORGE_ADDRESS
backend_url_env: RT_BACKEND_URL

# Wallet pool — operator funds these BEFORE running the battle.
# Each wallet needs:
#   • ~0.01 ETH gas (Base Sepolia faucet)
#   • USDC: 5 USDC for sponsors, 2 USDC for solvers/voters (covers
#     bond+fee at default floors of 0.5 USDC bond, 0.1 USDC fee).
wallet_pool:
  operator:    { index: 0, role: "oracle + admin + fee_wallet" }
  alice:       { index: 1, role: "primary sponsor" }
  bob:         { index: 2, role: "primary solver" }
  carol:       { index: 3, role: "primary voter" }
  dave:        { index: 4, role: "secondary solver" }
  eve:         { index: 5, role: "secondary voter" }
  frank:       { index: 6, role: "cosponsor" }
  grace:       { index: 7, role: "honest voter" }
  heidi:       { index: 8, role: "honest solver" }
  ivan:        { index: 9, role: "sybil operator wallet 1" }
  ivan2:       { index: 10, role: "sybil operator wallet 2 (linked to ivan)" }
  ivan3:       { index: 11, role: "sybil operator wallet 3 (linked to ivan)" }
  mallory:     { index: 12, role: "attacker" }
  mallory2:    { index: 13, role: "attacker secondary" }
  fee_wallet:  { index: 3, role: "platform fee recipient (alias of carol intentionally — fee_share routing)" }

# ───────────────────────────────────────────────────────────────
# DOMAIN MIX (24 questions)
#   technical: 8     governance: 5     policy: 4
#   design: 4        economic: 3
# ───────────────────────────────────────────────────────────────

scenarios:
  # ── smoke (1) — uses only operator/alice/bob; runs with 3-wallet
  #     minimum funding. First end-to-end chain broadcast under v2.5.
  # ──────────────────────────────────────────────────────────────
  - id: q00_smoke_min_wallets
    domain: technical
    title: "How do you ship a NOT NULL column to a 50M-row Postgres table without locking writes for the duration of the deploy?"
    description: |
      We run a Postgres 18 cluster on AWS RDS that handles ~12k
      writes per second sustained, with peaks at 40k around weekday
      mornings. The largest table — `events` — has 53M rows, sits
      at 47 GB on disk including indexes, and is JOINed into 80% of
      our hot-path queries. We need to add a `tenant_id BIGINT NOT
      NULL` column that all subsequent code paths will reference,
      including a foreign-key constraint to `tenants.id`. The
      backfill value for existing rows is derivable from a join to
      `users` (every row's user_id maps to exactly one tenant).
      Three constraints make this a real problem rather than a
      textbook one. First: we cannot take an exclusive lock on the
      table for more than 100ms during business hours; the
      synchronous-replication standby falls behind aggressively
      under any AccessExclusiveLock and our SLO budget for
      replication lag is 250ms. Second: the deploy pipeline must
      be reversible — if the new code path fails canary, we need
      to roll back the schema change and the application code
      atomically, with no partial-state data corruption. Third:
      the foreign-key constraint cannot be added with NOT VALID +
      VALIDATE CONSTRAINT alone because we want the constraint
      validated before any writes that could violate it land.
      Solutions should walk through: how the column is added with
      DEFAULT NULL, how the backfill is chunked (batch size,
      throttle, monitoring), when the NOT NULL is enforced, how
      the foreign key is added without a long-held lock, what
      the canary rollback looks like at each stage, and how to
      observe in-flight progress. A solution that says "use
      pg_repack" without explaining the lock interaction is
      insufficient. A solution that requires zero-downtime tooling
      we don't already run (e.g. Spilo, gh-ost) needs to justify
      that operational cost against the alternative.
    success_criteria:
      - { name: zero_lock_during_deploy, type: boolean, target: "true", weight: 40 }
      - { name: rollback_documented,     type: boolean, target: "true", weight: 35 }
      - { name: backfill_chunked,        type: boolean, target: "true", weight: 25 }
    sponsor: alice
    cosponsors: []
    solvers: [bob]
    voters: [operator]
    intended_winner_profile: bob
    expected_solver_count: 1
    expected_voter_count: 1
    expected_outcome: success

