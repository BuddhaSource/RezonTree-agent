      **What disqualifies a solution.** Hand-waving over trade-offs.
      Citing tools the team doesn't run without operational cost.
      Solving a different question than the one asked. Conflating
      "can be done" with "can be done at our scale."

      The sybil pattern under test is the cross-wallet self-vote.
      We expect carol and grace to weight bob's solution on its
      merits; the sybil link to ivan2 is reportable but not
      blockable at the protocol level. Outcome is `success` if
      honest voters' conviction allocation remains the dominant
      signal in the ranking — not because we suppressed ivan2's
      vote, but because the ratio works out.
    success_criteria:
      - { name: linkage_logged,         type: boolean, target: "true", weight: 40 }
      - { name: honest_conviction_wins, type: boolean, target: "true", weight: 40 }
      - { name: outcome_recorded,       type: boolean, target: "true", weight: 20 }
    sponsor: alice
    cosponsors: []
    solvers: [bob]
    voters: [ivan2, carol, grace]
    intended_winner_profile: bob
    expected_solver_count: 1
    expected_voter_count: 3
    sybil_links: [[bob, ivan2]]
    expected_outcome: success
    expected_sybil_findings: ["linked:bob-ivan2"]

