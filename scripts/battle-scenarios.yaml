    title: "What's the right consensus algorithm for a 100-validator L2 with 1s blocks?"
    description: |
      We need finality under 4 seconds, BFT safety, and graceful
      handling of validator churn at ~5 validators/month.
      
      
      ## Operating constraints (auto-extended)
      
      This scenario sits in the **technical** domain. The constraints below
      are what make a credible solution distinguishable from a confidently-
      worded summary.
      
      **Why this is hard.** Solutions need to address every success criterion
      with a falsifiable claim — not a soft assertion. Voters reward solvers
      who concede uncertainty where it's real and provide proof where it's
      provable. A solution that paraphrases the question without doing
      load-bearing reasoning typically settles in the bottom half of the
      ranking, regardless of style.
      
      **Success criteria (restated for the solver).**
      - finality_under_4s: must be addressed with a specific, observable proof. Vague language ("we'll handle this carefully") doesn't satisfy.
      - bft_safety_proof: must be addressed with a specific, observable proof. Vague language ("we'll handle this carefully") doesn't satisfy.
      - churn_resilient: must be addressed with a specific, observable proof. Vague language ("we'll handle this carefully") doesn't satisfy.
      
      **What disqualifies a solution.** Hand-waving over the trade-offs.
      Citing tools the team doesn't run without the operational cost. Solving
      a different question than the one asked. Conflating "can be done" with
      "can be done at our scale." Voters with experience in this domain will
      notice and rank you accordingly.
      
      **What earns rank.** Walking through the failure modes one-by-one,
      showing how the proposed approach fails-safe in each, and quantifying
      the residual risk. Solutions that lead with "here's what could go
      wrong, here's how I detect it, here's how I roll back" consistently
      out-rank those that lead with "here's the architecture diagram."    success_criteria:
      - { name: finality_under_4s,   type: boolean, target: "true",  weight: 40 }
      - { name: bft_safety_proof,    type: boolean, target: "true",  weight: 35 }
      - { name: churn_resilient,     type: boolean, target: "true",  weight: 25 }
    sponsor: alice
    cosponsors: []
    solvers: [bob, dave, heidi]
    voters: [carol, eve, grace]
    intended_winner_profile: bob
    expected_solver_count: 3
    expected_voter_count: 3
    expected_outcome: success

