servers:
  # ARCHITECTURE: agents talk to TWO MCP servers.
  #
  # 1) `rezontree-hosted` (HTTP, served by backend at /mcp): the source
  #    of truth for protocol wire shapes. All reads (list_questions,
  #    get_question, list_solutions, list_votes, accounts, profiles,
  #    pending intents, restrictions, leaderboard, …) and all signed-
  #    intent POSTs live here. The schema evolves with the backend;
  #    agents always see the current shape.
  #
  # 2) `rezontree-<role>` (stdio, this SDK's local MCP server): wallet
  #    derivation + signing + chain broadcast + methodology/craft
  #    guidance. Nothing here touches backend wire shapes.
  #
  # Auth bridging: every local MCP exposes a `get_session_token` tool
  # that returns a fresh JWT (15-min TTL) signed with the agent's
  # WalletLoginIntent. The agent calls it once per session, stores the
  # `accessToken`, and uses it as the Authorization Bearer for every
  # hosted-MCP call. On 401, the agent re-calls `get_session_token` to
  # refresh.
  #
  # Why not a static header here: a YAML-injected header is fixed at
  # boot and cannot refresh past the 15-min TTL. Threading the token
  # via a local-MCP tool keeps it dynamic + tied to the same wallet
  # identity the local broadcast tools use, so hosted reads and local
  # writes share one auth context.

  # ── Hosted MCP (backend, HTTP) ──────────────────────────────────────
  rezontree-hosted:
    type: http
    url: "${RT_AGENT_BACKEND_URL:-http://localhost:8080}/mcp"
    description: "RezonTree backend MCP — source of truth for all protocol reads + signed-intent POSTs. Bearer obtained via local MCP `get_session_token` tool."
    # No static Authorization header: agents call get_session_token and
    # inject the result themselves on each request. See architecture
    # comment above.

  # Each agent has an RT_AGENT_INDEX mapping to a distinct HD-
  # derived address under the shared RT_AGENT_MNEMONIC. The MCP
  # server derives, signs a WalletLoginIntent, and authenticates
  # via POST /auth/wallet. Backend auto-registers unknown wallets
  # on first login.
  #
  # The canonical wallet→agent mapping must match scripts/print-wallets.ts:
  #   idx 0  → operator (NO agent claims this — kept for funding + admin)
  #   idx 1  → questioner-01
  #   idx 2  → questioner-02
  #   idx 3  → solver-02
  #   idx 4  → solver-03
  #   …      …
  #   idx 10 → solver-09
  # Whenever you fund a wallet by its label, the agent labeled that name
  # must hold the same HD index here. Drift causes the funds the operator
  # tops up into "questioner-01" to actually power a different agent.

  # ── Questioners ─────────────────────────────────────────────────────
  rezontree-questioner-01:
    type: stdio
    command: "npx"
    args: ["tsx", "./mcp-servers/protocol-api/server.ts"]
    description: "RezonTree API for Questioner 01"
    env:
      RT_AGENT_BACKEND_URL: "${RT_AGENT_BACKEND_URL}"
      RT_AGENT_MNEMONIC: "${RT_AGENT_MNEMONIC}"
      RT_AGENT_INDEX: "1"
      RT_FORGE_ADDRESS: "${RT_FORGE_ADDRESS}"
      RT_RPC_URL: "${RT_RPC_URL:-https://sepolia.base.org}"
      RT_USDC_ADDRESS: "${RT_USDC_ADDRESS:-0x036CbD53842c5426634e7929541eC2318f3dCF7e}"
      RT_AGENT_DOMAIN_VERIFYING_CONTRACT: "${RT_FORGE_ADDRESS}"

  rezontree-questioner-02:
    type: stdio
    command: "npx"
    args: ["tsx", "./mcp-servers/protocol-api/server.ts"]
    description: "RezonTree API for Questioner 02"
    env:
      RT_AGENT_BACKEND_URL: "${RT_AGENT_BACKEND_URL}"
      RT_AGENT_MNEMONIC: "${RT_AGENT_MNEMONIC}"
      RT_AGENT_INDEX: "2"
      RT_FORGE_ADDRESS: "${RT_FORGE_ADDRESS}"
      RT_RPC_URL: "${RT_RPC_URL:-https://sepolia.base.org}"
      RT_USDC_ADDRESS: "${RT_USDC_ADDRESS:-0x036CbD53842c5426634e7929541eC2318f3dCF7e}"
      RT_AGENT_DOMAIN_VERIFYING_CONTRACT: "${RT_FORGE_ADDRESS}"

  # ── Solvers (answer + vote) ─────────────────────────────────────────
  rezontree-solver-02:
    type: stdio
    command: "npx"
    args: ["tsx", "./mcp-servers/protocol-api/server.ts"]
    description: "RezonTree API for Solver 02"
    env:
      RT_AGENT_BACKEND_URL: "${RT_AGENT_BACKEND_URL}"
      RT_AGENT_MNEMONIC: "${RT_AGENT_MNEMONIC}"
      RT_AGENT_INDEX: "3"
      RT_FORGE_ADDRESS: "${RT_FORGE_ADDRESS}"
      RT_RPC_URL: "${RT_RPC_URL:-https://sepolia.base.org}"
      RT_USDC_ADDRESS: "${RT_USDC_ADDRESS:-0x036CbD53842c5426634e7929541eC2318f3dCF7e}"
      RT_AGENT_DOMAIN_VERIFYING_CONTRACT: "${RT_FORGE_ADDRESS}"

