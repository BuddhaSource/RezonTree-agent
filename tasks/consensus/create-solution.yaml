name: create-solution
display_name: "Create Solution for Problem"
description: "Analyze a problem and generate a high-quality solution submission"

input:
  problem_id:
    type: string
    required: true
    description: "The problem ID to solve"
  focus_areas:
    type: array
    required: false
    description: "Specific areas to focus on"

steps:
  - name: fetch_problem
    agent: analyzer
    prompt: |
      Fetch problem {{problem_id}} from the protocol API.
      Analyze the success criteria, assumptions, and scope.
      Output a structured analysis with:
      - Key constraints
      - Challengeable assumptions worth exploring
      - What each success criterion actually requires
    output_key: analysis

  - name: draft_solution
    agent: solver
    prompt: |
      Based on this analysis:
      {{analysis}}

      Create a solution with:
      - Claims for each success criterion (with confidence %)
      - Proof for each claim (how + evidence)
      - Approach (components)
      - Reasoning (observation → reasoning → conclusion steps)

      PROTOCOL QUALITY FLOORS — backend rejects submissions below these:
      - SUMMARY: at least 1000 characters. Argue the answer in detail
        — synthesis, evidence, edge cases, why-this-not-that. A trivial
        "X works because Y" is not enough; the protocol is paying for
        rigor.
      - REASONING TREE: at least 6 because/therefore steps. Each step
        is a single inference link with non-empty `because` (premise)
        and `therefore` (conclusion). Decompose your argument into at
        least 6 distinct inference rungs; don't compress multiple
        ideas into one step.

      Be specific. Include numbers. Be honest about confidence.
    output_key: draft

  - name: review_solution
    agent: reviewer
    prompt: |
      Review this draft solution:
      {{draft}}

      Against this problem analysis:
      {{analysis}}

      Check for:
      - Are claims realistic?
      - Is proof sufficient?
      - Any gaps in reasoning?
      - Would you vote for this?

      Provide specific feedback.
    output_key: review

  - name: finalize_and_submit
    agent: solver
    prompt: |
      Refine your solution based on this review:
      {{review}}

      Before submitting, double-check the protocol floors:
      - body length ≥ 1000 chars (markdown source counts; ≤ 15000)
      - reasoning_tree has ≥ 6 because/therefore steps

      If either is short, expand before calling submit_solution.
      The backend returns VALIDATION_ERROR with the missing count
      so you can self-correct, but burning a round trip is sloppy.

      Then submit via the submit_solution tool.
      Problem ID: {{problem_id}}
    output_key: submission_result

on_success: |
  Solution submitted successfully: {{submission_result}}

on_failure: |
  Solution creation failed at step: {{failed_step}}
