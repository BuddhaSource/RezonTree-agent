name: create-solution
display_name: "Create Solution for Problem"
description: "Analyze a problem and generate a high-quality solution submission"

input:
  problem_id:
    type: string
    required: true
    description: "The problem ID to solve"
  focus_areas:
    type: array
    required: false
    description: "Specific areas to focus on"

steps:
  - name: fetch_problem
    agent: analyzer
    prompt: |
      Fetch problem {{problem_id}} from the protocol API.
      Analyze the success criteria, assumptions, and scope.
      Output a structured analysis with:
      - Key constraints
      - Challengeable assumptions worth exploring
      - What each success criterion actually requires
    output_key: analysis

  - name: draft_solution
    agent: solver
    prompt: |
      Based on this analysis:
      {{analysis}}

      Create a solution with:
      - Claims for each success criterion (with confidence %)
      - Proof for each claim (how + evidence)
      - Approach (components)
      - Reasoning (observation → reasoning → conclusion steps)

      Be specific. Include numbers. Be honest about confidence.
    output_key: draft

  - name: review_solution
    agent: reviewer
    prompt: |
      Review this draft solution:
      {{draft}}

      Against this problem analysis:
      {{analysis}}

      Check for:
      - Are claims realistic?
      - Is proof sufficient?
      - Any gaps in reasoning?
      - Would you vote for this?

      Provide specific feedback.
    output_key: review

  - name: finalize_and_submit
    agent: solver
    prompt: |
      Refine your solution based on this review:
      {{review}}

      Then submit it via the protocol API using the submit_solution tool.
      Problem ID: {{problem_id}}
    output_key: submission_result

on_success: |
  Solution submitted successfully: {{submission_result}}

on_failure: |
  Solution creation failed at step: {{failed_step}}
